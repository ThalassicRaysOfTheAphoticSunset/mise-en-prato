[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cupomzinho"
version = "0.1.0"
description = "Cupom fiscal, gasto de mercado e caça a preço — NFC-e do Paraná"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "beautifulsoup4>=4.13",
    "lxml>=5.3",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",  # o FastAPI exige para receber a foto do QR
    "pyzbar>=0.1.9",
    "pillow>=11",
]

[tool.setuptools]
packages = ["cupomzinho"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# sem instalar o próprio pacote: o pytest acha o cupomzinho/ pela raiz do repo
pythonpath = ["."]
