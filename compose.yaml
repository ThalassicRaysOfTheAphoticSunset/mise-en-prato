services:
  app:
    build:
      context: .
      target: producao
    container_name: mise-en-prato
    restart: unless-stopped
    user: "1000:1000"
    network_mode: host
    environment:
      - TZ=America/Sao_Paulo
      - PYTHONUNBUFFERED=1
      - APP_MODE=${APP_MODE:-home}
      - DADOS=/dados
      - ESCUTAR=${ESCUTAR:-100.122.128.48}
      - PORTA=${PORTA:-8090}
      - LOCAL=${LOCAL:--25.2947,-54.0940}
      - RAIO_KM=${RAIO_KM:-15}
      - TETO_CONSULTAS_HORA=${TETO_CONSULTAS_HORA:-50}
      - MORADORES=${MORADORES}
    volumes:
      - /mnt/data/mise-en-prato:/dados
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro
      - /etc/localtime:/etc/localtime:ro

  dev:
    build:
      context: .
      target: dev
    container_name: mise-en-prato-dev
    ports:
      - "8090:8090"
    environment:
      - TZ=America/Sao_Paulo
      - PYTHONUNBUFFERED=1
      - APP_MODE=dev
      - EXIGIR_TAILNET=false
      - ESCUTAR=0.0.0.0
      - MORADORES=${MORADORES:-dev@local.test=Dev}
      - LOCAL=${LOCAL:--25.2947,-54.0940}
      - RAIO_KM=${RAIO_KM:-15}
      - TETO_CONSULTAS_HORA=${TETO_CONSULTAS_HORA:-50}
    volumes:
      - .:/app
