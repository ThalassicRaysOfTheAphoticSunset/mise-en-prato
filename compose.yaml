services:
  # O cupomzinho: cupom fiscal da casa, gasto de mercado e caça a preço.
  #
  # App separada, com repositório próprio e privado no GitHub. Mora dentro de
  # ~/srv só para o Dockge enxergar o stack — o histórico dela é dela, e o
  # .gitignore do casa-srv ignora esta pasta inteira.
  cupomzinho:
    # `build` e não `image`: esta é a única stack da casa com dependências
    # próprias. Elas moram na imagem, e é por isso que o host segue sem nada
    # instalado. Mesmo arranjo do dragonwilds.
    build:
      context: .
      target: producao
    container_name: cupomzinho
    restart: unless-stopped
    # uid 1000 = miguel, o dono de /mnt/data. O contêiner escreve o banco.
    user: "1000:1000"
    # Rede do host, e NÃO publicação de porta. Aqui está a razão, que custou um
    # teste no celular para aparecer: em rede bridge o Docker mascara o IP de
    # origem dos clientes externos, e o contêiner recebe o gateway da bridge
    # (172.x) no lugar do IP da tailnet de quem pediu. Do próprio host o teste
    # passa por coincidência — a origem já é 100.122.128.48 —, então o defeito
    # só aparece de fora. Sem o IP real não há `whois`, e sem `whois` todo
    # morador leva 403. Mesma escolha do vigia, por motivo parecido.
    network_mode: host
    environment:
      - TZ=America/Sao_Paulo
      - PYTHONUNBUFFERED=1 # senão o log do contêiner só aparece em blocos
      - DADOS=/dados
      # Com a rede do host, quem prende a porta é o uvicorn. Prender no IP da
      # tailnet e não em 0.0.0.0 é o que mantém a promessa: isto é o extrato de
      # mercado da casa, e visita no Wi-Fi de casa é LAN, não é morador (mesma
      # decisão do painel). Preço a pagar, igual ao de lá: sem tailscaled de pé
      # o bind falha e o contêiner só sobe na volta do `restart`. Se o IP da
      # tailnet mudar, é esta linha.
      - ESCUTAR=${ESCUTAR:-100.122.128.48}
      - PORTA=${PORTA:-8090}
      # LOCAL é o centro da busca no Menor Preço, "lat,lon" — Medianeira.
      - LOCAL=${LOCAL:--25.2947,-54.0940}
      - RAIO_KM=${RAIO_KM:-15}
      # Teto baixo de propósito: ~30 consultas em 25 minutos foram suficientes
      # para a API do estado começar a devolver dado FABRICADO com HTTP 200.
      # Ver o detector em cupomzinho/sanidade.py e o README.
      - TETO_CONSULTAS_HORA=${TETO_CONSULTAS_HORA:-20}
      - MORADORES=${MORADORES}
    volumes:
      # O banco, o HTML cru de cada cupom e os backups.
      - /mnt/data/cupomzinho:/dados
      # O socket do tailscaled é 0666: dá o `whois` do IP de origem sem CLI e
      # sem privilégio. É assim que a app sabe quem está enviando o cupom, sem
      # inventar mais uma senha para a casa decorar.
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro
      - /etc/localtime:/etc/localtime:ro
networks: {}
