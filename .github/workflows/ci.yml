name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # exigência do pyzbar e do OCR local (Tesseract)
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libzbar0 tesseract-ocr tesseract-ocr-por

      - run: pip install ".[dev]"

      - run: ruff check .

      - run: pytest -q

      # O drill.sh do casa-srv varre o índice DELE e não enxerga esta pasta,
      # que é repositório à parte. Então a verificação de segredo é aqui.
      - name: segredo não entra no git
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env está rastreado pelo git"; exit 1
          fi
          if grep -rIl --exclude-dir=.git -E '@(gmail|hotmail|outlook|yahoo)\.com' .; then
            echo "::error::e-mail de morador em arquivo versionado"; exit 1
          fi
          echo "ok: nenhum segredo rastreado"

  deploy:
    needs: testes
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Conectar à Tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Executar deploy no casa-srv
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.CASA_SRV_HOST || '100.122.128.48' }}
          USER: ${{ secrets.CASA_SRV_USER || 'miguel' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -v -i ~/.ssh/id_deploy -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            "cd ~/srv/mise-en-prato && git pull origin main && docker compose build app && docker compose up -d app"
